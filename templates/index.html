<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Phishing Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>URL Phishing Detector</h1>
            <p>Check if a URL is potentially malicious using our advanced machine learning model</p>
        </div>

        <div class="input-section">
            <form id="urlForm">
                <input type="url" id="urlInput" class="url-input" placeholder="Enter URL to analyze" required>
                <button type="submit" class="analyze-btn">Analyze URL</button>
            </form>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Analyzing URL...</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <div id="results" class="results-section">
            <div class="result-header">
                <div class="result-icon">
                    <i id="resultIcon" class="fas"></i>
                </div>
                <div class="result-details">
                    <h2 id="resultTitle"></h2>
                    <p id="resultUrl"></p>
                </div>
            </div>

            <div class="confidence-section">
                <div class="scores-grid">
                    <div class="score-card">
                        <h3>Raw Score</h3>
                        <div class="confidence-bar">
                            <div id="rawScoreBar" class="confidence-level"></div>
                        </div>
                        <p id="rawScoreText" class="score-text"></p>
                    </div>
                    
                    <div class="score-card">
                        <h3>Trust Score</h3>
                        <div class="confidence-bar">
                            <div id="trustScoreBar" class="confidence-level"></div>
                        </div>
                        <p id="trustScoreText" class="score-text"></p>
                    </div>
                    
                    <div class="score-card">
                        <h3>Final Score</h3>
                        <div class="confidence-bar">
                            <div id="finalScoreBar" class="confidence-level"></div>
                        </div>
                        <p id="finalScoreText" class="score-text"></p>
                    </div>
                </div>
            </div>

            <div class="indicators-section">
                <div class="indicators-grid">
                    <div class="indicator-card">
                        <h3><i class="fas fa-check-circle"></i> Trust Indicators</h3>
                        <ul id="trustIndicators" class="indicators-list"></ul>
                    </div>
                    <div class="indicator-card">
                        <h3><i class="fas fa-exclamation-triangle"></i> Warning Indicators</h3>
                        <ul id="warningIndicators" class="indicators-list"></ul>
                    </div>
                </div>
            </div>

            <div class="features-section">
                <h3>URL Analysis Details</h3>
                <div id="featuresGrid" class="features-grid">
                    <!-- Features will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('urlForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const url = document.getElementById('urlInput').value.trim();
            if (!url) return;
            
            document.getElementById('loading').classList.add('show');
            document.getElementById('results').classList.remove('show');
            document.getElementById('errorMessage').classList.remove('show');
            
            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ url: url })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                updateResults(data);
                document.getElementById('results').classList.add('show');
            } catch (error) {
                const errorMessage = document.getElementById('errorMessage');
                errorMessage.textContent = error.message;
                errorMessage.classList.add('show');
            } finally {
                document.getElementById('loading').classList.remove('show');
            }
        });

        function updateResults(data) {
            // Update result header
            const resultIcon = document.getElementById('resultIcon');
            const resultTitle = document.getElementById('resultTitle');
            const resultUrl = document.getElementById('resultUrl');
            
            if (data.is_phishing) {
                resultIcon.className = 'fas fa-exclamation-triangle';
                resultIcon.style.color = 'var(--danger-color)';
                resultTitle.textContent = 'Potential Phishing Website';
                resultTitle.style.color = 'var(--danger-color)';
            } else {
                resultIcon.className = 'fas fa-check-circle';
                resultIcon.style.color = 'var(--success-color)';
                resultTitle.textContent = 'Legitimate Website';
                resultTitle.style.color = 'var(--success-color)';
            }
            
            resultUrl.textContent = data.url;
            
            // Update confidence bars
            updateConfidenceBar('rawScoreBar', 'rawScoreText', data.raw_probability);
            updateConfidenceBar('trustScoreBar', 'trustScoreText', data.trust_score);
            updateConfidenceBar('finalScoreBar', 'finalScoreText', data.adjusted_probability);
            
            // Update indicators
            updateIndicators('trustIndicators', data.trust_indicators);
            updateIndicators('warningIndicators', data.warning_indicators);
            
            // Update features
            updateFeatures(data.features);
        }

        function updateConfidenceBar(barId, textId, value) {
            const bar = document.getElementById(barId);
            const text = document.getElementById(textId);
            
            bar.style.width = `${value}%`;
            bar.style.backgroundColor = value > 50 ? 'var(--danger-color)' : 'var(--success-color)';
            text.textContent = `${value.toFixed(1)}%`;
            text.style.color = value > 50 ? 'var(--danger-color)' : 'var(--success-color)';
        }

        function updateIndicators(listId, indicators) {
            const list = document.getElementById(listId);
            list.innerHTML = indicators.length ? 
                indicators.map(indicator => `<li>${indicator}</li>`).join('') :
                '<li class="no-indicators">No indicators found</li>';
        }

        function updateFeatures(features) {
            const grid = document.getElementById('featuresGrid');
            grid.innerHTML = '';
            
            const featureGroups = {
                'URL Structure': [
                    'url_length', 
                    'domain_length', 
                    'has_ip', 
                    'has_at_symbol', 
                    'has_double_slash',
                    'has_dash',
                    'has_multiple_subdomains'
                ],
                'Domain Information': [
                    'domain_age_days',
                    'is_domain_young',
                    'days_to_expiration',
                    'is_expiring_soon',
                    'has_registrar',
                    'has_a_record',
                    'has_mx_record',
                    'num_mx_records',
                    'has_ns_record',
                    'num_ns_records',
                    'is_private_ip'
                ],
                'Security': [
                    'is_https',
                    'ssl_is_valid',
                    'ssl_days_valid'
                ]
            };
            
            for (const [group, featureList] of Object.entries(featureGroups)) {
                featureList.forEach(feature => {
                    if (feature in features) {
                        const card = createFeatureCard(feature, features[feature]);
                        grid.appendChild(card);
                    }
                });
            }
        }

        function createFeatureCard(feature, value) {
            const card = document.createElement('div');
            card.className = 'feature-card';
            
            const title = formatFeatureName(feature);
            const formattedValue = formatFeatureValue(feature, value);
            const isPositive = isPositiveFeature(feature, value);
            
            card.innerHTML = `
                <h3>${title}</h3>
                <p class="${isPositive ? 'positive' : 'negative'}">${formattedValue}</p>
            `;
            
            return card;
        }

        function formatFeatureName(feature) {
            return feature
                .split('_')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
        }

        function formatFeatureValue(feature, value) {
            if (typeof value === 'undefined' || value === null) return 'N/A';
            
            switch(feature) {
                case 'domain_age_days':
                    const days = parseFloat(value);
                    return days >= 365 ? `${(days / 365).toFixed(1)} years` : `${Math.round(days)} days`;
                case 'days_to_expiration':
                case 'ssl_days_valid':
                    return `${Math.round(parseFloat(value))} days`;
                case 'url_length':
                case 'domain_length':
                    return `${value} characters`;
                case 'num_mx_records':
                case 'num_ns_records':
                    return `${value} records`;
                default:
                    if (value === '1' || value === 1) return 'Yes';
                    if (value === '0' || value === 0) return 'No';
                    return value;
            }
        }

        function isPositiveFeature(feature, value) {
            if (typeof value === 'undefined' || value === null) return false;
            
            const positiveFeatures = {
                'url_length': (val) => parseInt(val) < 75,
                'domain_length': (val) => parseInt(val) < 30,
                'has_ip': (val) => val === '0' || val === 0,
                'has_at_symbol': (val) => val === '0' || val === 0,
                'has_double_slash': (val) => val === '0' || val === 0,
                'has_dash': (val) => val === '0' || val === 0,
                'has_multiple_subdomains': (val) => val === '0' || val === 0,
                'domain_age_days': (val) => parseFloat(val) > 180,
                'is_domain_young': (val) => val === '0' || val === 0,
                'days_to_expiration': (val) => parseFloat(val) > 90,
                'is_expiring_soon': (val) => val === '0' || val === 0,
                'has_registrar': (val) => val === '1' || val === 1,
                'is_https': (val) => val === '1' || val === 1,
                'ssl_is_valid': (val) => val === '1' || val === 1,
                'ssl_days_valid': (val) => parseFloat(val) > 90,
                'has_mx_record': (val) => val === '1' || val === 1,
                'num_mx_records': (val) => parseInt(val) > 0,
                'has_ns_record': (val) => val === '1' || val === 1,
                'num_ns_records': (val) => parseInt(val) >= 2,
                'has_a_record': (val) => val === '1' || val === 1,
                'is_private_ip': (val) => val === '0' || val === 0
            };
            
            return feature in positiveFeatures ? positiveFeatures[feature](value) : false;
        }
    </script>
</body>
</html>
